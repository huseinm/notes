services:
  notes:
    build:
      context: .
      dockerfile: Dockerfile
    image: notes-self-hosted:latest
    container_name: notes
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persistent SQLite database and uploaded attachments
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
